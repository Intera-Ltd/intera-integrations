# Dependency updates, grouped so each ecosystem gives at most one PR a week.
# Major versions are not proposed automatically: a major bump (for example
# .NET 10 -> 11) is a planned change made by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
      - /integrations/intera/*/bundle
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /integrations/intera/*/service
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: nuget
    directories:
      - /shared/dotnet/*
      - /integrations/intera/*/service
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
