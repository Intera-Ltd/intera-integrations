name: Release

# A tag <developer>/<integration>/v<version> on main releases one integration:
# the service image goes to ghcr.io/<owner>/<developer>/<integration>:<version>,
# its digest is written into the packed manifest.yaml, and the artifact
# (<developer>-<integration>-<version>.tar.gz) is attached to a GitHub release.
on:
  push:
    tags: ['*/*/v*']
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration folder under integrations/, e.g. intera/hello-dotnet'
        required: true
        type: string
      create_release:
        description: 'Also create the GitHub release and its tag (otherwise only push the image and keep the artifact on the run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.integration }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and its tag
      packages: write   # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce release from main only
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Manual release dispatch is allowed only from refs/heads/main (got $REF)."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::Commit $SHA is not on main. Releases must be cut from commits merged into main."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Repository tooling
        run: npm ci

      - name: Resolve the integration
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.integration }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug='[a-z0-9]+(-[a-z0-9]+)*'
          if [ "$EVENT" = "push" ]; then
            if ! [[ $REF_NAME =~ ^($slug)/($slug)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag $REF_NAME is not <developer>/<integration>/v<X.Y.Z>"; exit 1
            fi
            developer=${BASH_REMATCH[1]}; integration=${BASH_REMATCH[3]}; tag_version=${BASH_REMATCH[5]}
          else
            if ! [[ $INPUT =~ ^($slug)/($slug)$ ]]; then
              echo "::error::'$INPUT' is not <developer>/<integration>"; exit 1
            fi
            developer=${BASH_REMATCH[1]}; integration=${BASH_REMATCH[3]}; tag_version=""
          fi
          dir="integrations/$developer/$integration"
          [ -f "$dir/manifest.yaml" ] || { echo "::error::$dir/manifest.yaml not found"; exit 1; }
          version=$(node -e "const y=require('js-yaml');const m=y.load(require('fs').readFileSync(process.argv[1],'utf8'),{schema:y.CORE_SCHEMA});process.stdout.write(String(m.version))" "$dir/manifest.yaml")
          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "::error::Tag version $tag_version does not match manifest.yaml version $version"; exit 1
          fi
          tag="$developer/$integration/v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub release $tag already exists. Published versions are immutable; bump version in manifest.yaml."
            exit 1
          fi
          {
            echo "dir=$dir"
            echo "developer=$developer"
            echo "integration=$integration"
            echo "version=$version"
            echo "tag=$tag"
            echo "image=ghcr.io/${OWNER,,}/$developer/$integration"
            if [ -f "$dir/service/Dockerfile" ]; then echo "service=true"; else echo "service=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Bundle - install, build, unit tests
        env:
          DIR: ${{ steps.target.outputs.dir }}
        run: |
          cd "$DIR/bundle"
          npm ci --no-audit --no-fund
          npm test
          cd - >/dev/null
          node scripts/validate-manifest.mjs "$DIR"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.target.outputs.service == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.target.outputs.service == 'true'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.target.outputs.service == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse overwriting an existing image version tag
        if: steps.target.outputs.service == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::Image tag $IMAGE:$VERSION already exists in ghcr.io. Versions are immutable; bump version instead of overwriting."
            exit 1
          fi

      - name: Build and push the service image
        id: image
        if: steps.target.outputs.service == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.target.outputs.dir }}/service
          build-contexts: |
            intera-common=shared/dotnet/Intera.Common
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.title=${{ steps.target.outputs.developer }}.${{ steps.target.outputs.integration }}

      - name: Pack the artifact with the image digest
        id: pack
        env:
          DIR: ${{ steps.target.outputs.dir }}
          SERVICE: ${{ steps.target.outputs.service }}
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ "$SERVICE" = "true" ]; then
            archive=$(scripts/pack.sh "$DIR" --image "$IMAGE@$DIGEST" --out-dir out --release | tail -1)
          else
            archive=$(scripts/pack.sh "$DIR" --out-dir out --release | tail -1)
          fi
          tar -tzf "$archive"
          {
            echo "archive=$archive"
            echo "name=$(basename "$archive" .tar.gz)"
            echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          {
            echo "## ${{ steps.target.outputs.developer }}.${{ steps.target.outputs.integration }} $VERSION"
            echo
            if [ "$SERVICE" = "true" ]; then
              echo "- Image: \`$IMAGE:$VERSION\`"
              echo "- Digest: \`$DIGEST\`"
              echo "- deployment.image: \`$IMAGE@$DIGEST\`"
            fi
            echo "- Artifact: \`$(basename "$ARCHIVE")\` (sha256 \`$ARCHIVE_SHA\`)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

      - name: GitHub release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          SERVICE: ${{ steps.target.outputs.service }}
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          {
            echo "Catalog artifact: \`$(basename "$ARCHIVE")\` (sha256 \`$ARCHIVE_SHA\`)."
            if [ "$SERVICE" = "true" ]; then
              echo
              echo "Service image: \`$IMAGE@$DIGEST\` (tag \`$VERSION\`)."
            fi
          } > notes.md
          gh release create "$TAG" "$ARCHIVE" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
