name: Pull request

on:
  pull_request:
    branches: [main]

# Pull requests (including forks) get a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit tests of the repository scripts
        run: npm test
      - name: Check every manifest.yaml and the repository layout
        run: node scripts/validate-manifest.mjs --all

  detect:
    name: Changed integrations
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs=$(node scripts/changed-integrations.mjs "$BASE_SHA" "$HEAD_SHA")
          echo "Changed: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository tooling
        run: npm ci

      - name: Bundle - install, build, unit tests
        run: |
          cd "$DIR/bundle"
          npm ci --no-audit --no-fund
          npm test

      - name: Manifest and built bundle
        run: node scripts/validate-manifest.mjs "$DIR"

      - name: Has a service?
        id: service
        run: |
          if [ -f "$DIR/service/Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.service.outputs.present == 'true'

      - name: Service image (not pushed)
        if: steps.service.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}/service
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-service:pr

      - name: Service smoke test (health path, non-root, bundle against the container)
        if: steps.service.outputs.present == 'true'
        run: node scripts/smoke-service.mjs "$DIR" ci-service:pr

      - name: Pack artifact
        id: pack
        run: |
          archive=$(scripts/pack.sh "$DIR" --out-dir out | tail -1)
          tar -tzf "$archive"
          echo "name=artifact-$(echo "$DIR" | tr / -)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/*.tar.gz
          retention-days: 7
          if-no-files-found: error
