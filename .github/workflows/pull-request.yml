name: Pull request

on:
  pull_request:
    branches: [main]

# Pull requests (including forks) get a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit tests of the repository scripts
        run: npm test
      - name: Check every manifest.yaml and the repository layout
        run: node scripts/validate-manifest.mjs --all

  dotnet-tests:
    name: .NET service unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run .NET unit tests
        run: |
          if [ -f shared/dotnet/Intera.Integrations.Tests/Intera.Integrations.Tests.csproj ]; then
            dotnet test shared/dotnet/Intera.Integrations.Tests/Intera.Integrations.Tests.csproj -c Release --nologo
          fi

  detect:
    name: Changed integrations
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs=$(node scripts/changed-integrations.mjs "$BASE_SHA" "$HEAD_SHA")
          echo "Changed: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Repository tooling
        run: npm ci

      - name: Bundle - install, build, unit tests
        run: |
          cd "$DIR/bundle"
          npm ci --no-audit --no-fund
          npm test

      - name: Manifest and built bundle
        run: node scripts/validate-manifest.mjs "$DIR"

      - name: Has a service?
        id: service
        run: |
          if [ -f "$DIR/service/Dockerfile" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.service.outputs.present == 'true'

      - name: Service image (not pushed)
        if: steps.service.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.dir }}/service
          build-contexts: |
            intera-common=shared/dotnet/Intera.Common
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-service:pr

      - name: Service smoke test (health path, non-root, bundle against the container)
        if: steps.service.outputs.present == 'true'
        run: node scripts/smoke-service.mjs "$DIR" ci-service:pr

      - name: Pack artifact
        id: pack
        run: |
          archive=$(scripts/pack.sh "$DIR" --out-dir out | tail -1)
          tar -tzf "$archive"
          echo "name=artifact-$(echo "$DIR" | tr / -)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/*.tar.gz
          retention-days: 7
          if-no-files-found: error
